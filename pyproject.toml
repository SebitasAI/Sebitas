[project]
name = "misterr"
version = "0.1.0"
description = "Misterr: use-case-agnostic AI coworker platform that lives in Slack (skeleton slice)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "alembic>=1.13",
    "slack-bolt>=1.20",
    "aiohttp>=3.10",
    "anthropic>=0.49",
    "langfuse>=4.0,<5",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "langgraph>=1.2.2",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary,pool]>=3.3.4",
    "litellm>=1.86.2",
    "e2b-code-interpreter>=2.7.0",
    "boto3>=1.43.16",
    "youtube-transcript-api>=1.2.4",
    "cryptography>=48.0.0",
    "pyyaml>=6.0",
    "croniter>=2.0",
    "python-jose[cryptography]>=3.5.0",
]

# This is an application, not a library: uv manages the venv + deps but does not
# build/install `app` as a package. `app` is imported from the project root
# (uvicorn / `python -m` add the cwd to sys.path; alembic uses prepend_sys_path).
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# DB-dependent tests are marked `integration` and skip when TEST_DATABASE_URL
# isn't set. Unit tests (frontmatter, storage, prompt_builder logic with
# fakes) always run.
markers = [
    "integration: requires a live Postgres at TEST_DATABASE_URL",
]
